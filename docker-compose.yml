services:
  # App & Socket Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kode-runner-app:latest
    container_name: kode-runner-app
    restart: always
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - VITE_SERVER_URL=http://localhost:8080
      - VITE_REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Standard OpenSource Redis Service
  redis:
    image: redis:alpine
    container_name: kode-runner-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
