services:
  # App & Socket Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kode-runner-app:latest
    container_name: kode-runner-app
    restart: always
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - NODE_ENV=production
      # 서버가 실제로 읽는 변수. 이게 없으면 방 상태·리더보드가 조용히 인메모리로 떨어져
      # Redis 경로가 로컬에서 전혀 검증되지 않는다.
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Standard OpenSource Redis Service
  redis:
    image: redis:alpine
    container_name: kode-runner-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
